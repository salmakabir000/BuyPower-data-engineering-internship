[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-orchestrator"
version = "0.1.0"
description = "A small DAG runner built to learn what Airflow/Dagster/Prefect actually do underneath."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
mini_orchestrator = "mini_orchestrator.cli:main"

[tool.setuptools]
packages = ["mini_orchestrator"]
