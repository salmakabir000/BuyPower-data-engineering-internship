[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "config-pipeline"
version = "0.1.0"
description = "A generic, YAML-driven ETL engine"
requires-python = ">=3.10"
dependencies = ["pyyaml", "pandas", "pyarrow", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
config_pipeline = "config_pipeline.cli:main"

[tool.setuptools]
packages = ["config_pipeline"]
